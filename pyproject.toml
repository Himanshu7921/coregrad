[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coregrad"
version = "0.1.0"
description = "Minimal scalar-based automatic differentiation engine"
readme = "README.md"
requires-python = ">=3.9"

authors = [
    {name = "Himanshu Singh"}
]

license = {text = "MIT"}

dependencies = [
    "numpy",
    "graphviz",
]

[project.optional-dependencies]
dev = [
    "torch"
]

[tool.setuptools.packages.find]
where = ["src"]